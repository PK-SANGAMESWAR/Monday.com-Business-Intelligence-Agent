[project]
name = "monday-com-business-intelligence-agent"
version = "0.1.0"
description = "AI agent answering founder-level business intelligence questions over monday.com boards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers --strict-config"
markers = [
    "live: touches the real monday.com or Anthropic API; deselected by default",
]

[tool.coverage.run]
branch = true
source = ["bi_agent"]
